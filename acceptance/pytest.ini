[pytest]
# Each test has its own repository, HOME and app, so they run side by side; -n 0 runs them one by one.
# worksteal moves waiting tests off a worker that is stuck on a slow one.
addopts = -n 4 --dist worksteal
markers =
    slow: takes far longer than the others; runs first
# xdist's workers have threads, so forking the app's pty warns; pexpect execs straight after the fork, which is safe.
filterwarnings =
    ignore:This process .* is multi-threaded, use of forkpty\(\):DeprecationWarning
