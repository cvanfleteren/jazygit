changes.help.commits.reset=Reset to commit…
changes.help.commits.revert.details=Adds a commit that undoes the selected commit.
changes.help.commits.revert=Revert commit…
changes.help.commits.reword.details=Changes the message of the selected commit. The commits after it are rewritten, and uncommitted changes are stashed and brought back afterwards.
changes.help.commits.reword=Reword commit…
