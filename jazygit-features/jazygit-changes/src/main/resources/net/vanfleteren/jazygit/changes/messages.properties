changes.help.files.render=Show the selected Markdown file rendered, or as source
changes.help.files.blame=Show who last changed each line of the selected file, or stop to
changes.help.files.blame.details=Beside the version of the selected file shown as source, or the file without changes, shows for each line the commit that last changed it, its author and its date, in its staged and unstaged changes alike; again, stops to.
changes.help.files.stage.details=Stages the changes to the selected file or directory. When everything in it is already staged, it unstages it instead.
changes.help.files.stage=Stage/unstage
