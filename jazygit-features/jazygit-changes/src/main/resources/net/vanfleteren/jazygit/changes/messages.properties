changes.help.files.commit=Commit…
changes.help.files.discard.details=Throws away the changes to the selected file or directory, all of them or only the unstaged ones. This cannot be undone.
changes.help.files.discard=Discard changes…
changes.help.files.edit.details=Opens the selected file in an editor you set to open files in the settings file, or else in your git editor.
changes.help.files.edit=Edit file
