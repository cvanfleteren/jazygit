changes.help.files.stash=Stash changes…
changes.help.files.version.details=Shows the whole new version of the selected file beside it, then its original, then its diff again, in its staged and unstaged changes alike.
changes.help.files.version=Show the new version of the selected file, its original, or its diff
changes.help.diff.expandDown=On a marker, show 10 more lines below the hunk above it; on a line of the split diff, go to the new side
changes.help.diff.expandDown.details=Shows more hidden lines below the marker at the cursor.
changes.help.diff.expandUp=On a marker, show 10 more lines above the hunk below it; on a line of the split diff, go to the old side
changes.help.diff.expandUp.details=On a marker of hidden lines in the rich diff, shows the 10 lines above the hunk below it. The first time in a file, the file is read whole first.
changes.help.diff.expandAll=On a marker, show all the lines it leaves out; in JSON or YAML rendered, open or close a node; on a line blamed, open its commit
changes.help.diff.expandAll.details=Shows all the hidden lines of the marker at the cursor. In a version of JSON or YAML rendered, closes the node at the cursor, or opens it. On a line of a version shown blamed, opens the files of the commit that last changed it, on its file.
changes.help.diff.foldAll=In JSON or YAML rendered, close every node, or open them all
changes.help.diff.foldAll.details=In a version of JSON or YAML rendered, closes every node while any is open, else opens them all.
changes.help.diff.version=Show the new version of the file, its original, or its diff
changes.help.diff.version.details=In a rich diff of one file, shows the whole new version of the file, then its original, then its diff again.
changes.help.diff.render=Show a version of a Markdown, JSON or YAML file rendered, or as source
changes.help.diff.render.details=In a rich diff of one Markdown, JSON or YAML file, shows its new version, or the version shown, drawn as Markdown or as a tree, with a bar beside what changed; again, shows it as source.
changes.help.diff.blame=Show who last changed each line of the version shown, or stop to
changes.help.diff.blame.details=Beside a version of the file shown as source, or a file without changes, shows for each line the commit that last changed it, its author and its date, and keeps showing it for the other version; again, stops to.
changes.help.diff.edit=Open the file in an editor, at the line of the cursor
changes.help.diff.edit.details=Opens the file of the cursor at its line, in an editor you set to open files in the settings file, or else in your git editor, at its start. A removed line opens where it was in the new file.
changes.help.diff.copy=Copy the line of the cursor, the lines of the range, or the path on the bar of a file
changes.help.diff.copy.details=Copies the selected lines, without their + or -, or the path of a file, to the clipboard.
changes.help.diff.range=Start a range of lines at the cursor, to copy, or drop it
changes.help.diff.range.details=Starts a range of lines at the cursor, within its hunk, to copy with y; pressed again, or Esc, drops it. The lines of the range are marked in the gutter.
changes.help.diff.search=Search what is shown
changes.help.diff.search.details=Opens a line to type what to look for; Enter goes to the first match, ignoring case unless it has an uppercase letter.
changes.help.diff.nextMatch=Go to the next match of the search
changes.help.diff.nextMatch.details=Goes to the next match of the search; after the last, to the first.
changes.help.diff.previousMatch=Go to the match of the search before
changes.help.diff.previousMatch.details=Goes to the match of the search before; before the first, to the last.
changes.help.diff.goToLine=Go to a line of the file, by its number
changes.help.diff.goToLine.details=Opens a line to type a line number in; Enter goes to that line of the file of the cursor, showing it where the diff leaves it out.
changes.help.diff.nextFile=Go to the next file of the files pane
changes.help.diff.nextFile.details=Highlights the next file in the files pane and shows its diff here, keeping the focus here. Files in collapsed directories count too. Only for a diff opened from the files pane.
changes.help.diff.previousFile=Go to the previous file of the files pane
changes.help.diff.previousFile.details=Highlights the previous file in the files pane and shows its diff here, keeping the focus here. Files in collapsed directories count too. Only for a diff opened from the files pane.
changes.help.stash.drop.details=Deletes the selected stash without applying it. This cannot be undone.
changes.help.stash.drop=Delete stash…
changes.help.stash.files=Go to the changed files
