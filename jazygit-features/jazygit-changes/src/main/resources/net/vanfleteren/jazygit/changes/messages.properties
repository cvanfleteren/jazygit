changes.help.commitFiles.version=Show the new version of the selected file, its original, or its diff
changes.help.commitFiles.version.details=Shows the whole new version of the selected file beside it, then its original, then its diff again.
changes.help.commits.amend.details=Adds the staged changes to the selected commit, keeping its message.
changes.help.commits.amend=Amend commit with staged changes…
