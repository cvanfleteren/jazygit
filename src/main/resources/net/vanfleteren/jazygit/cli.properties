# Text of the command line. picocli reads the help by its own keys; the others are MessageFormat patterns,
# where a literal apostrophe must be doubled ('').

# Help
usage.description=A terminal UI for git.
path=Where inside the repository to open; the current directory by default.
theme=The theme for this session only, one of: ${COMPLETION-CANDIDATES}. The saved theme stays as it is.
mixinStandardHelpOptions.help=Show this help and exit.
mixinStandardHelpOptions.version=Show the version and exit.

# Version
jazygit.version=jazygit {0}
jazygit.version.unknown=jazygit, a development build

# Errors
theme.unknown=''{0}'' is not a theme; expected one of: {1}
