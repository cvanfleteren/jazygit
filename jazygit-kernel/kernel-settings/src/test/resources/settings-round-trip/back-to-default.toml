# my settings
future = true
old-key = "kept"

[ui]
# the one I like
theme = "dark"
other = 3

[mine]
x = [1, 2]

[[editors]]
# the IDE
name = "IntelliJ"
command = ["idea", "{dir}"]
shortcut = "i"

[[diff-filters]]
id = "mine"
name = "Generated sources"
paths = ["**/generated/**"]

[[agents]]
# the main one
name = "Claude"
command = ["claude", "{prompt}"]
terminal = true
shortcut = "c"
prompt = "Fix {failures}"
