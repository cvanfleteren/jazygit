name: Publish fat-jar and native image

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  snapshot:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The verify job already ran the tests and checks.
      - name: Build fat-jar and native image
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Pnative package -DskipTests
          version=$(./mvnw --batch-mode --no-transfer-progress -N help:evaluate -Dexpression=project.version -q -DforceStdout)
          mv jazygit-app/target/jazygit "jazygit-app/target/jazygit-$version-linux-x86_64"

      - name: Replace the rolling snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot jazygit-app/target/jazygit-*-fat.jar jazygit-app/target/jazygit-*-linux-x86_64 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest snapshot" \
            --notes "Automated build of main at $GITHUB_SHA"

  release:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from the release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./mvnw --batch-mode --no-transfer-progress versions:set -DnewVersion="$version" -DgenerateBackupPoms=false

      # The verify job already ran the tests and checks.
      - name: Build fat-jar and native image
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Pnative package -DskipTests
          version=$(./mvnw --batch-mode --no-transfer-progress -N help:evaluate -Dexpression=project.version -q -DforceStdout)
          mv jazygit-app/target/jazygit "jazygit-app/target/jazygit-$version-linux-x86_64"

      - name: Attach fat-jar and native image to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" jazygit-app/target/jazygit-*-fat.jar jazygit-app/target/jazygit-*-linux-x86_64 --clobber
