name: Publish fat-jar and native image

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build fat-jar and native image
        run: |
          mvn --batch-mode --no-transfer-progress -Pnative verify
          version=$(mvn --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)
          mv target/jazygit "target/jazygit-$version-linux-x86_64"

      - name: Replace the rolling snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot target/jazygit-*-fat.jar target/jazygit-*-linux-x86_64 \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest snapshot" \
            --notes "Automated build of main at $GITHUB_SHA"

  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from the release tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="$version" -DgenerateBackupPoms=false

      - name: Build fat-jar and native image
        run: |
          mvn --batch-mode --no-transfer-progress -Pnative verify
          version=$(mvn --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)
          mv target/jazygit "target/jazygit-$version-linux-x86_64"

      - name: Attach fat-jar and native image to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" target/jazygit-*-fat.jar target/jazygit-*-linux-x86_64 --clobber
