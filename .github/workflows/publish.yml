name: Publish fat-jar and native image

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event_name }}
  cancel-in-progress: false

# The native image builds while the tests and checks run; it is only published once they passed.
jobs:
  verify:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '25'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version from the release tag
        if: github.event_name == 'release'
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./mvnw --batch-mode --no-transfer-progress versions:set -DnewVersion="$version" -DgenerateBackupPoms=false

      # The verify job runs the tests and checks.
      - name: Build fat-jar and native image
        run: |
          ./mvnw --batch-mode --no-transfer-progress -T1 -Pnative package -DskipTests
          version=$(./mvnw --batch-mode --no-transfer-progress -N help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Packed, the native image is a quarter of its size and keeps its executable bit.
          # Owned by root, so unpacking it with sudo does not hand it to the runner's uid.
          XZ_OPT=-9T0 tar -C jazygit-app/target --owner=0 --group=0 --numeric-owner -cJf "jazygit-app/target/jazygit-$version-linux-x86_64.tar.xz" jazygit

      - name: Run the packed native image
        run: |
          unpacked=$(mktemp -d)
          tar -xJf jazygit-app/target/jazygit-*-linux-x86_64.tar.xz -C "$unpacked"
          "$unpacked/jazygit" --version

      - name: Keep the fat-jar and native image
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            jazygit-app/target/jazygit-*-fat.jar
            jazygit-app/target/jazygit-*-linux-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 1

  snapshot:
    needs: [verify, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: binaries

      - name: Replace the rolling snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot binaries/jazygit-*-fat.jar binaries/jazygit-*-linux-x86_64.tar.xz \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest snapshot" \
            --notes "Automated build of main at $GITHUB_SHA"

  release:
    needs: [verify, build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: binaries

      - name: Attach fat-jar and native image to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" binaries/jazygit-*-fat.jar binaries/jazygit-*-linux-x86_64.tar.xz --clobber
