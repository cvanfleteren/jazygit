name: Build

# Pushes to main and releases are verified by publish.yml, which calls this workflow before publishing.
# A pull request that only changes documentation isn't built: no build or test reads it. The review still runs.
# That is decided by the changes job rather than by paths-ignore, so build-ok runs on every pull request: it is the
# check main requires before a pull request can be merged, also by auto-merge, and a required check that never runs
# would keep a documentation-only pull request from being merged.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The Maven tests and checks run side by side with the acceptance tests, which run the jar built without tests, a
# share of them on each of four machines.
# verify doesn't wait for that jar: Maven can't take up a build from another job (the resources it copies again
# make it compile the modules after them again), so it would only start later and build all the same.
jobs:
  # Whether anything but documentation changed: always outside a pull request. The files ignored are the root's
  # Markdown files, the documentation and the acceptance tests' README. A renamed file counts by both its paths, so
  # moving code into the documentation still builds. Not being able to list the files fails the job, and so build-ok.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Look at the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          code=$(grep -v -E '^[^/]+\.md$|^documentation/|^acceptance/README\.md$' <<< "$files" || true)
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # The git of the flake's nixpkgs rather than the runner image's, so the tests meet the same git whichever image
      # the runner has; flake.lock pins it.
      - name: Set up git from the flake
        run: |
          nix profile install --inputs-from . nixpkgs#git
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build, test and check
        run: |
          git --version
          ./mvnw --batch-mode --no-transfer-progress verify

  package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the jar
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Keep the fat jar
        uses: actions/upload-artifact@v7
        with:
          name: fat-jar
          path: jazygit-app/target/jazygit-*-fat.jar
          if-no-files-found: error
          retention-days: 1

  acceptance:
    needs: package
    name: acceptance (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: acceptance/requirements.txt

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # The same git as verify's: the acceptance tests check what git made of the repository.
      - name: Set up git from the flake
        run: |
          nix profile install --inputs-from . nixpkgs#git
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Download the fat jar
        uses: actions/download-artifact@v8
        with:
          name: fat-jar
          path: jar

      - name: Acceptance tests
        run: |
          git --version
          pip install -r acceptance/requirements.txt
          python -m pytest acceptance -v --jar "$(ls jar/jazygit-*-fat.jar)" --shard ${{ matrix.shard }}/4

  # The one check main requires: passes when the jobs above passed, or were skipped as only documentation changed.
  build-ok:
    needs: [changes, verify, package, acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the build
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
