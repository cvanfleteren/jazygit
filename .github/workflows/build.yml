name: Build

# Pushes to main and releases are verified by publish.yml, which calls this workflow before publishing.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The Maven tests and checks run side by side with the acceptance tests, which run the jar built without tests, a
# share of them on each of four machines.
# verify doesn't wait for that jar: Maven can't take up a build from another job (the resources it copies again
# make it compile the modules after them again), so it would only start later and build all the same.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # The git of the flake's nixpkgs rather than the runner image's, so the tests meet the same git whichever image
      # the runner has; flake.lock pins it.
      - name: Set up git from the flake
        run: |
          nix profile install --inputs-from . nixpkgs#git
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build, test and check
        run: |
          git --version
          ./mvnw --batch-mode --no-transfer-progress verify

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the jar
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Keep the fat jar
        uses: actions/upload-artifact@v7
        with:
          name: fat-jar
          path: jazygit-app/target/jazygit-*-fat.jar
          if-no-files-found: error
          retention-days: 1

  acceptance:
    needs: package
    name: acceptance (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: acceptance/requirements.txt

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      # The same git as verify's: the acceptance tests check what git made of the repository.
      - name: Set up git from the flake
        run: |
          nix profile install --inputs-from . nixpkgs#git
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Download the fat jar
        uses: actions/download-artifact@v8
        with:
          name: fat-jar
          path: jar

      - name: Acceptance tests
        run: |
          git --version
          pip install -r acceptance/requirements.txt
          python -m pytest acceptance -v --jar "$(ls jar/jazygit-*-fat.jar)" --shard ${{ matrix.shard }}/4
