name: Build

# Pushes to main and releases are verified by publish.yml, which calls this workflow before publishing.
# A pull request that only changes documentation isn't built: no build or test reads it. The review still runs.
# That is decided by the changes job rather than by paths-ignore, so build-ok runs on every pull request: it is the
# check main requires before a pull request can be merged, also by auto-merge, and a required check that never runs
# would keep a documentation-only pull request from being merged.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The Maven tests run side by side with the acceptance tests, which run the jar built without tests, a share of them
# on each of six machines. The job that builds that jar checks nothing, so the acceptance tests don't wait for
# ErrorProne: the checks job compiles once more with it, and runs Spotless and checkstyle, beside the others.
# verify doesn't wait for that jar: Maven can't take up a build from another job (the resources it copies again
# make it compile the modules after them again), so it would only start later and build all the same.
jobs:
  # Whether anything but documentation changed: always outside a pull request. The files ignored are the root's
  # Markdown files, the documentation and the acceptance tests' README. A renamed file counts by both its paths, so
  # moving code into the documentation still builds. Not being able to list the files fails the job, and so build-ok.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Look at the changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          code=$(grep -v -E '^[^/]+\.md$|^documentation/|^acceptance/README\.md$' <<< "$files" || true)
          if [ -n "$code" ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"

  verify:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore the Maven repository
        uses: ./.github/actions/maven-cache

      # Each run keeps its build cache under a key of its own, and starts from the latest one with the same JDK and the
      # same git for the tests (flake.lock); see .mvn/maven-build-cache-config.xml.
      - name: Restore the build cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/build-cache
          key: build-cache-verify-${{ steps.java.outputs.version }}-${{ hashFiles('flake.lock', '.mvn/maven-build-cache-config.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-cache-verify-${{ steps.java.outputs.version }}-${{ hashFiles('flake.lock', '.mvn/maven-build-cache-config.xml') }}-

      - name: Install Nix
        uses: cachix/install-nix-action@v32

      # The git of the flake's nixpkgs rather than the runner image's, so the tests meet the same git whichever image
      # the runner has; flake.lock pins it.
      - name: Set up git from the flake
        run: |
          nix profile install --inputs-from . nixpkgs#git
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      # The checks job checks the code, so the tests here don't wait for ErrorProne, Spotless or checkstyle. A module
      # that didn't change since the build cache saw it is restored, its tests not run again.
      - name: Build and test
        run: |
          git --version
          ./mvnw --batch-mode --no-transfer-progress verify -Dmaven.build.cache.enabled=true \
            -Derrorprone.skip -Dspotless.check.skip -Dcheckstyle.skip

  # The fat jar for the acceptance tests, as soon as can be: no tests, and no checks, which the checks job does.
  jar:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore the Maven repository
        uses: ./.github/actions/maven-cache

      # A cache of its own, apart from the checks job's: a module this build restores was never checked, so the
      # checks job must not restore it in turn. Neither the git nor the ErrorProne exceptions matter to it.
      - name: Restore the build cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/build-cache
          key: build-cache-jar-${{ steps.java.outputs.version }}-${{ hashFiles('.mvn/maven-build-cache-config.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-cache-jar-${{ steps.java.outputs.version }}-${{ hashFiles('.mvn/maven-build-cache-config.xml') }}-

      # shade makes the fat jar, also when the build cache restores every module.
      - name: Build the jar
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Dmaven.build.cache.enabled=true -DskipTests package \
            -Derrorprone.skip -Dspotless.check.skip -Dcheckstyle.skip

      - name: Keep the fat jar
        uses: actions/upload-artifact@v7
        with:
          name: fat-jar
          path: jazygit-app/target/jazygit-*-fat.jar
          if-no-files-found: error
          retention-days: 1

      # The seconds each acceptance test took, kept by main's latest build, by which the shards split the tests.
      # Restored here, once, so that every shard gets the same: main may keep newer ones while the shards run, and
      # shards that split by other durations would run some tests twice and leave others out. Without any, an empty
      # file: the shards then split as before durations were kept.
      - name: Restore the acceptance tests' durations
        uses: actions/cache/restore@v6
        with:
          path: acceptance-durations.json
          key: acceptance-durations-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: acceptance-durations-

      - name: Keep the acceptance tests' durations
        run: |
          [ -f acceptance-durations.json ] || echo '{}' > acceptance-durations.json
          echo "durations of $(grep -c '": ' acceptance-durations.json || true) tests"

      - uses: actions/upload-artifact@v7
        with:
          name: acceptance-durations
          path: acceptance-durations.json
          if-no-files-found: error
          retention-days: 1

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        id: java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Restore the Maven repository
        uses: ./.github/actions/maven-cache

      # As verify's, but a cache of its own: this build has ErrorProne and no tests, so it's the ErrorProne exceptions
      # rather than the git that start a new one.
      - name: Restore the build cache
        uses: actions/cache@v6
        with:
          path: ~/.m2/build-cache
          key: build-cache-checks-${{ steps.java.outputs.version }}-${{ hashFiles('errorprone-ignorable-results.txt', '.mvn/maven-build-cache-config.xml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: build-cache-checks-${{ steps.java.outputs.version }}-${{ hashFiles('errorprone-ignorable-results.txt', '.mvn/maven-build-cache-config.xml') }}-

      # Spotless checks the formatting and ErrorProne the main sources as they compile, of the modules the build
      # cache doesn't restore.
      - name: Spotless and ErrorProne
        run: ./mvnw --batch-mode --no-transfer-progress -Dmaven.build.cache.enabled=true -DskipTests package

      # Without the build cache, so it checks every module.
      - name: Checkstyle
        run: ./mvnw --batch-mode --no-transfer-progress checkstyle:check

  acceptance:
    needs: jar
    name: acceptance (${{ matrix.shard }}/6)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: acceptance/requirements.txt

      - name: Install Nix
        uses: cachix/install-nix-action@v32

      # The same git as verify's: the acceptance tests check what git made of the repository.
      - name: Set up git from the flake
        run: |
          nix profile install --inputs-from . nixpkgs#git
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Download the fat jar
        uses: actions/download-artifact@v8
        with:
          name: fat-jar
          path: jar

      - name: Download the acceptance tests' durations
        uses: actions/download-artifact@v8
        with:
          name: acceptance-durations
          path: durations

      - name: Acceptance tests
        run: |
          git --version
          pip install -r acceptance/requirements.txt
          python -m pytest acceptance -v --jar "$(ls jar/jazygit-*-fat.jar)" --shard ${{ matrix.shard }}/6 \
            --shard-durations durations/acceptance-durations.json --save-durations measured.json

      # Only main's durations are kept: a pull request's might be those of a change that never lands.
      - name: Keep the durations measured
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: measured-durations-${{ matrix.shard }}
          path: measured.json
          if-no-files-found: error
          retention-days: 1

  # On main, once every shard passed: the durations just measured join those kept, for the next builds to split the
  # acceptance tests by. A cache saved on main is one every pull request can restore.
  durations:
    needs: acceptance
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Only for the next builds' split, which then takes the durations kept before: failing to keep them must not fail
    # publish.yml's verify, which calls this workflow on main.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the durations the shards split by
        uses: actions/download-artifact@v8
        with:
          name: acceptance-durations
          path: durations

      - name: Download the durations the shards measured
        uses: actions/download-artifact@v8
        with:
          pattern: measured-durations-*
          path: measured

      - name: Merge the durations
        run: |
          python3 acceptance/shards.py merge durations/acceptance-durations.json measured/*/measured.json \
            -o acceptance-durations.json

      - name: Keep the durations
        uses: actions/cache/save@v6
        with:
          path: acceptance-durations.json
          key: acceptance-durations-${{ github.run_id }}-${{ github.run_attempt }}

  # The one check main requires: passes when the jobs above passed, or were skipped as only documentation changed.
  build-ok:
    needs: [changes, verify, jar, checks, acceptance]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check the build
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
