name: Build

# Pushes to main and releases are verified by publish.yml, which calls this workflow before publishing.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The Maven tests and checks run side by side with the acceptance tests, which run the jar built without tests.
# verify doesn't wait for that jar: Maven can't take up a build from another job (the resources it copies again
# make it compile the modules after them again), so it would only start later and build all the same.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, test and check
        run: ./mvnw --batch-mode --no-transfer-progress verify

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build the jar
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Keep the fat jar
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: jazygit-app/target/jazygit-*-fat.jar
          if-no-files-found: error
          retention-days: 1

  acceptance:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: acceptance/requirements.txt

      - name: Download the fat jar
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: jar

      - name: Acceptance tests
        run: |
          pip install -r acceptance/requirements.txt
          python -m pytest acceptance -v --jar "$(ls jar/jazygit-*-fat.jar)"
