name: Build

# Pushes to main and releases are verified by publish.yml, which calls this workflow before publishing.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: acceptance/requirements.txt

      # Runs the fat jar that verify built, with the JDK set up above.
      - name: Acceptance tests
        run: |
          pip install -r acceptance/requirements.txt
          python -m pytest acceptance -v
