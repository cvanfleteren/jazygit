name: Claude on demand

# Runs only when someone mentions @claude in a comment on an issue or PR, or in an inline review comment.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Outsiders' comments don't start a job; claude-code-action also rejects users without write access.
    if: |
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required for Claude to read CI results on PRs
      contents: write        # needed to push merge commits
      pull-requests: write   # needed for gh pr create / comments
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # full history so merge/rebase against main works

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh pr create:*),Bash(gh issue comment:*),Bash(mvn:*),Bash(./mvnw:*),Edit,Write,Read,Glob,Grep"
