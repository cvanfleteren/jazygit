[ui]
theme = "light"
diff-style = "plain"
diff-words = false
diff-pairs = false
repository-heights = [25, 25, 25]
pull-requests-width = 50
pull-requests-heights = [40, 30]
diff-filters = ["java-imports", "lockfiles"]

[git]
auto-refresh = false

[github.browsers."github.com"]
cvf-work = "firefox -P work"

[[agents]]
name = "Codex"
command = ["codex"]
terminal = true
prompt = "Fix it"
