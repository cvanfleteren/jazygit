# my settings
future = true
old-key = "kept"

[ui]
# the one I like
theme = "light"
repository-heights = [25, 25, 25]
diff-filters = ["java-imports", "lockfiles"]
other = 3
diff-style = "plain"
diff-words = false
diff-pairs = false
pull-requests-width = 50
pull-requests-heights = [40, 30]

[git]
auto-refresh = false

[github.browsers."github.com"]
# personal
cvf = "firefox -P personal"
cvf-work = "firefox -P work"

[mine]
x = [1, 2]

[[editors]]
# the IDE
name = "IntelliJ"
command = ["idea", "{dir}"]
shortcut = "i"

[[diff-filters]]
id = "mine"
name = "Generated sources"
paths = ["**/generated/**"]

[[agents]]
name = "Codex"
command = ["codex"]
terminal = true
prompt = "Fix it"
