help.branches.browse.details=Opens the selected branch on GitHub, in the browser. The branch must be on a remote.
help.branches.browse=Open branch on GitHub
help.branches.checkout.details=Switches to the selected branch. When your changes would be overwritten, it offers to stash them and bring them across.
help.branches.checkout=Checkout branch
help.branches.delete.details=Deletes the selected branch locally, on the remote, or both.
help.branches.delete=Delete branch
help.branches.legend.checks=CI passed / failed / running
help.branches.legend.gone=Its upstream was deleted
help.branches.legend.pullRequest=Pull request (dim: draft)
help.branches.legend.review=Approved / changes / to review
help.branches.legend.worktree=Checked out in another worktree
help.branches.merge.details=Merges the selected branch into the checked out one: as a regular merge, with or without a merge commit, or as a squash merge, committed or left uncommitted. A merge that stops on conflicts is left for you to resolve them, then continue or abort it (M); a squash merge you commit yourself once they are resolved.
help.branches.merge=Merge into checked out branch
help.branches.new.details=Creates a branch from the selected one and checks it out.
help.branches.new=New branch
help.branches.newWorktree.details=Checks the selected branch out in a new worktree, a directory of its own next to this one, to work on it alongside this one.
help.branches.newWorktree=New worktree for branch
help.branches.nextTab=Next tab
help.branches.previousTab=Previous tab
help.branches.pull.details=Pulls the checked out branch from its upstream; when that stops on conflicts, it is left for you to resolve them, then continue or abort it (M). Any other branch is fast-forwarded to its upstream, which only works when it has no commits of its own that are not pushed.
help.branches.pull=Pull branch
help.branches.pullRequest.details=Shows the pull request of the selected branch, from which it can be opened, commented on, merged or closed. A branch without one gets a new pull request once it is pushed: you choose the branch it merges into, then its title (that of its first commit to start with), its body, and whether it is a draft.
help.branches.pullRequest=Create pull request or show it
help.branches.push.details=Pushes the selected branch to its upstream. Without an upstream, it asks where to push it. When the branch has diverged from the remote, it offers a force push (with lease).
help.branches.push=Push branch
help.branches.rebase.details=Rebases the checked out branch onto the selected one. Uncommitted changes are stashed and brought back afterwards. A rebase that stops on conflicts is left for you to resolve them, then continue, skip or abort it (M).
help.branches.rebase=Rebase onto branch
help.branches.rename.details=Renames the selected local branch. It keeps following the same upstream.
help.branches.rename=Rename branch
help.branches.upstream.details=Options on the upstream. View the divergence of the selected branch from its upstream, or from the base branch (origin/main, or the local main or master): the commits only on either side are listed, each with its diff; Esc goes back to the branches. Or reset the checked out branch onto its upstream as this repository last fetched it: the changes since are kept staged (soft), kept unstaged (mixed) or discarded (hard). Its commits that are not on the upstream are left behind.
help.branches.upstream=Upstream options
help.commits.amend.details=Adds the staged changes to the selected commit and keeps its message. Unstaged changes are left alone. When nothing is staged, you can choose to add all changes. The commits after it are rewritten; when one of them conflicts, the rebase stops there for you to resolve the conflicts, then continue, skip or abort it (M). A merge commit can only be amended when it is the last commit.
help.commits.amend=Amend commit with staged changes
help.commits.cherryPickCopy.details=Copies the selected commit, to cherry-pick it onto another branch: check that branch out and press V in the commits panel. Esc lets go of the copy. This is not possible for a merge commit.
help.commits.cherryPickCopy=Copy commit to cherry-pick
help.commits.cherryPickPaste.details=Cherry-picks the copied commit onto the checked out branch. A cherry-pick that stops on conflicts is left for you to resolve them, then continue, skip or abort it (M). When it fails otherwise, it is undone and the commit stays copied, so it can be tried again.
help.commits.cherryPickPaste=Cherry-pick copied commit
help.commits.drop.details=Removes the selected commit and its changes. The commits after it are rewritten, and uncommitted changes are stashed and brought back afterwards. When a later commit conflicts without it, the rebase stops there for you to resolve the conflicts, then continue, skip or abort it (M). This is not possible for a merge commit or for the only commit.
help.commits.drop=Drop commit
help.commits.fixup.details=Merges the selected commit into the one below it and keeps the message of either the commit below or the selected one.
help.commits.fixup=Fixup commit into the one below
help.commits.moveToBranch.details=Moves the selected commit and the ones after it off the checked out branch and onto a new branch, which is checked out. Handy when you committed on the wrong branch.
help.commits.moveToBranch=Move commits to branch
help.commits.newBranch.details=Creates a branch at the selected commit and checks it out.
help.commits.newBranch=New branch from commit
help.commits.reset.details=Moves the checked out branch to the selected commit. The changes since then are kept staged (soft), kept unstaged (mixed) or discarded (hard).
help.commits.reset=Reset to commit
help.commits.reword.details=Changes the message of the selected commit. The commits after it are rewritten, and uncommitted changes are stashed and brought back afterwards.
help.commits.reword=Reword commit
help.commits.search.details=Lists only the commits of the checked out branch that match what you type, from all of its history, not just the commits shown. The words are found in the message; author:name, path:dir/file and -S:text find the commits by an author, that change a path, or that add or remove a text. author: and path: can be given more than once, and a value with spaces goes in double quotes, as in author:"Jane Doe". Case is ignored unless you type an uppercase letter. Enter runs the search, and Esc clears it again; Esc while typing only closes the line, keeping the commits listed.
help.commits.search=Search commits
help.commits.squash.details=Merges the selected commit into the one below it and keeps both messages. This is not possible for the first commit or for a merge commit.
help.commits.squash=Squash commit into the one below
help.divergence.close=Back to the branches
help.files.amend.details=Adds the staged changes to the last commit and keeps its message. When nothing is staged, you can choose to add all changes. You can reword the message afterwards from the commits panel.
help.files.amend=Amend last commit
help.files.commit.details=Commits the staged changes, asking for a summary and an optional description. When nothing is staged, it offers to stage all files first.
help.files.commit=Commit
help.files.discard.details=Throws away the changes to the selected file or directory, all of them or only the unstaged ones. This cannot be undone.
help.files.discard=Discard changes
help.files.edit.details=Opens the selected file in the editor git uses for commit messages: $GIT_EDITOR, core.editor, $VISUAL or $EDITOR, else vi. jazygit makes way for it until it is closed.
help.files.edit=Edit file
help.files.stage.details=Stages the changes to the selected file or directory. When everything in it is already staged, it unstages it instead.
help.files.stage=Stage/unstage
help.files.stash.details=Stashes all changes, staged, unstaged and untracked, under an optional name. They show in the stash panel.
help.files.stash=Stash changes
help.global.cherryPickDrop=Let go of the commit copied to cherry-pick
help.global.help=Show the keys of the panel
help.global.ignoreWhitespace=Show or leave out changes to whitespace only in the diffs
help.global.inProgress=Continue or abort the merge, rebase, cherry-pick or revert in progress
help.global.quit=Quit
help.global.recentRepos=Switch to a recent repository
help.global.screen=Switch between the repository and the pull requests
help.global.settings=Show the settings
help.prs.browse=Open pull request on GitHub
help.prs.browse.details=Opens the selected pull request on GitHub, in the browser.
help.prs.checkout=Check out pull request
help.prs.checkout.details=Checks out the selected pull request of this repository, from a fork too, on a local branch that follows the branch it comes from (gh pr checkout). The working tree must have no changes.
help.prs.refresh=Read the pull requests again
help.prs.show=Show pull request, or open one of another repository in the browser
help.prs.show.details=Shows the selected pull request of this repository, from which it can be opened in the browser, merged, closed, or turned into a draft or marked ready for review. A pull request of another repository opens in the browser.
help.remoteBranches.checkout.details=Checks out the local branch that follows the selected remote branch. When there is none, it creates one with the same name. When that name is already taken, it asks for another.
help.remoteBranches.checkout=Checkout as a local branch that follows it
help.remoteBranches.delete.details=Deletes the selected branch on the remote. This cannot be undone.
