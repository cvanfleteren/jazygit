# The text of app: each key starts with app, which is how Messages finds this bundle (ADR 136).
# User-visible text. Parameters are MessageFormat arguments; a literal apostrophe must be doubled ('').
app.debugLog.failed=Could not write the debug log {0}: {1}
app.debugLog.written=The debug log is in {0}
app.help.global.cherryPickDrop=Let go of the commit copied to cherry-pick
app.help.global.cherryPickDrop.details=Forgets the commit copied with C in the commits pane, so V has nothing to cherry-pick. Esc does this only when nothing else, such as a range of lines, takes it.
app.help.global.diffStyle=Draw the diffs plainly, or with line numbers and the changed words highlighted
app.help.global.diffStyle.details=Switches the diffs between plain git output and a rich view with line numbers and word highlights.
app.help.global.diffWords=Highlight the changed words of a line in the rich diff, or only the line
app.help.global.diffWords.details=In the rich diff, highlights the words a line changes, or only marks the whole line. Kept for the next session.
app.help.global.help=Show the keys of the panel
app.help.global.ignoreWhitespace=Show or leave out changes to whitespace only in the diffs
app.help.global.ignoreWhitespace.details=Leaves out the changes to whitespace only (git diff -w) from the diffs, or shows them again. The shown diffs are read again. Only for this session.
app.help.global.moreContext=Show more lines around the changes in the diffs
app.help.global.moreContext.details=Shows more lines of context around the changes, up to the whole file.
app.help.global.lessContext=Show fewer lines around the changes in the diffs
app.help.global.lessContext.details=Shows fewer lines of context around the changes, down to none.
app.help.global.maximize=Maximize the focused pane or the content panel, or restore it
app.help.global.maximize.details=Gives the focused pane as much room as possible, the content panel by collapsing the left column; press again to restore it.
app.help.global.commandLog=Scroll through the command log
app.help.global.commandLog.details=Gives the focus to the command log, which grows to show the commands of the last 100 operations and the whole error or notice, to scroll through. A click on the log gives it the focus too; Escape gives the focus back.
app.help.global.inProgress=Continue or abort the merge, rebase, cherry-pick or revert in progress…
app.help.global.inProgress.details=Continues, skips or aborts a merge, rebase, cherry-pick or revert that stopped.
app.help.global.narrower=Make the left column narrower
app.help.global.narrower.details=Makes the left column of this screen 5% of the width narrower, down to 15%, then collapses it for this session. Kept for the next session.
app.help.global.quit=Quit
app.help.global.recentRepos=Switch to a recent repository…
app.help.global.recentRepos.details=Lists the repositories opened last, the last first, with what each has checked out, and switches to the one chosen. One that is gone is forgotten.
app.help.global.screen=Switch between the repository and the pull requests
app.help.global.screen.details=Switches between the repository screen and the pull requests screen, which is read again when it shows. Each screen keeps its own widths and heights.
app.help.global.settings=Show the settings…
app.help.global.settings.details=Shows the settings: the themes, the animations, and for GitHub the gh executable, the account this repository uses and its browser.
app.help.global.shorter=Make the focused pane of the left column shorter
app.help.global.shorter.details=Makes the focused pane a row shorter.
app.help.global.taller=Make the focused pane of the left column taller
app.help.global.taller.details=Makes the focused pane a row taller.
app.help.global.wider=Make the left column wider
app.help.global.wider.details=Makes the left column of this screen 5% of the width wider, up to 70%; a collapsed one opens at 15%. Kept for the next session.
app.theme.loadFailed=Could not load the theme {0}: {1}
app.window.title=jazygit - {0}
